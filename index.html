/* Efek memantul untuk ikon saat tab aktif */
@keyframes navActiveIcon {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.25); }
    100% { transform: translateY(-4px) scale(1.15); }
}

/* Efek munculnya latar belakang (pill) saat tab aktif */
@keyframes navActivePill {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

/* Efek turunnya garis indikator atas */
@keyframes navActiveLine {
    0% { transform: translate(-50%, -100%); opacity: 0; }
    100% { transform: translate(-50%, 0); opacity: 1; }
}

.nav-icon-active {
    animation: navActiveIcon 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.nav-pill-active {
    animation: navActivePill 0.3s ease-out forwards;
}
.nav-line-active {
    animation: navActiveLine 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
/* Efek Bola (Orb) melompat keluar dari navbar */
@keyframes orbPopOut {
    0% { transform: translateY(15px) scale(0.3); opacity: 0; }
    50% { transform: translateY(-30px) scale(1.1); opacity: 1; }
    100% { transform: translateY(-26px) scale(1); opacity: 1; } /* Dinaikkan agar tidak menabrak teks */
}

/* Efek Teks meluncur dari bawah */
@keyframes textSlideUp {
    0% { transform: translateY(10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
}

.nav-orb-active {
    animation: orbPopOut 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.nav-text-active {
    animation: textSlideUp 0.4s ease-out forwards;
    animation-delay: 0.1s; /* Memberi jeda sedikit agar bola naik duluan */
}

        position: absolute; left: -200px; top: 70px; width: 300px; height: 300px;
